<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Faith • Hope • Grace | Prayer Race</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#f5f7ff;background:#0a1022}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#263762,#0a1022 65%);min-height:100vh}.wrap{max-width:1050px;margin:auto;padding:25px 16px 70px}header{text-align:center;padding:24px 0}h1{font-size:clamp(30px,6vw,60px);margin:4px;letter-spacing:-2px}h2{font-size:clamp(22px,4vw,35px)}.sub{color:#b5c2e3}.panel{background:#182443;border:1px solid #3b4b70;border-radius:22px;padding:24px;margin:16px 0;box-shadow:0 12px 40px #050a1a66}.center{text-align:center}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}button{border:0;border-radius:13px;padding:17px 20px;font-size:17px;font-weight:750;cursor:pointer;color:white;background:#5267e7}button:hover{filter:brightness(1.14)}button:disabled{opacity:.48;cursor:not-allowed}.secondary{background:#394765}.faith{background:#8c68ed}.hope{background:#238de1}.grace{background:#1aab77}.answer{min-height:86px;text-align:left}.track{position:relative;background:#26324e;border:1px dashed #56617b;border-radius:14px;margin:15px 0;padding:11px 14px;overflow:hidden}.trackline{position:relative;height:45px;border-bottom:3px dashed #6e7790}.car{position:absolute;left:0;top:0;transition:left 1s cubic-bezier(.2,.8,.2,1);font-size:33px;filter:drop-shadow(0 3px 5px #0008)}.track b{display:block;margin-bottom:7px}.finish{position:absolute;right:0;top:0;height:100%;border-right:8px repeating-linear-gradient(0deg,white 0 7px,#111 7px 14px)}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.score{font-size:22px;font-weight:900}.muted{color:#b6c2df}.good{color:#68e5ae}.bad{color:#ff9292}input{background:#0d1730;border:1px solid #57688f;border-radius:12px;color:white;font-size:19px;padding:15px;width:100%;margin:8px 0}#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#f2d0a6;color:#221b12;padding:10px 18px;border-radius:12px;display:none;z-index:5}.big{font-size:44px}.confetti{font-size:35px;letter-spacing:8px;animation:bounce 1s infinite alternate}@keyframes bounce{to{transform:translateY(-10px)}}.pill{border-radius:30px;background:#33466c;padding:7px 14px;font-size:13px}.rank{padding:12px;border-bottom:1px solid #43506b}a{color:#9bcaff;overflow-wrap:anywhere}</style></head><body><div class="wrap"><header><div class="sub">🏁 THE ULTIMATE BIBLE PRAYER CHALLENGE</div><h1>Faith • Hope • Grace</h1><div class="sub">20 questions · 3 teams · 1 champion</div></header><main id="app"></main></div><div id="toast"></div><script>
const app=document.getElementById('app'),names=['Faith','Hope','Grace'],colors={Faith:'#9872f5',Hope:'#4aa9f4',Grace:'#32c994'};
let id=JSON.parse(localStorage.getItem('prayerRaceIdentity')||'{}'),last='',state=null,selected=null;
const save=()=>localStorage.setItem('prayerRaceIdentity',JSON.stringify(id));
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(msg){let t=document.getElementById('toast');t.textContent=msg;t.style.display='block';setTimeout(()=>t.style.display='none',3500)}
async function api(action,data={}){try{let r=await fetch('/api/'+action,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...id,...data})});let j=await r.json();if(j.error)throw Error(j.error);return j}catch(e){toast(e.message);return null}}
async function create(){let j=await api('create');if(j){id={code:j.code,token:j.token};save();last='';renderHome();poll()}}
async function join(team){let code=document.getElementById('code').value.trim().toUpperCase();if(!code)return toast('Enter your room code');let j=await api('join',{code,team});if(j){id=j;save();last='';poll()}}
async function act(action,data){let j=await api(action,data||{});if(j)poll()}
function reset(){localStorage.removeItem('prayerRaceIdentity');id={};state=null;last='';renderHome()}
function renderHome(){if(id.code&&id.token){app.innerHTML='<div class="panel center"><h2>Reconnecting to your game…</h2><button onclick="reset()">Leave room</button></div>';return}
let room=new URLSearchParams(location.search).get('room')||'';
app.innerHTML='<div class="panel center"><h2>Ready to race?</h2><p class="muted">Host the game on a computer. Join from three separate phones.</p><button onclick="create()">🏁 Host a new game</button></div><div class="panel center"><h2>Join your team</h2><input id="code" placeholder="6-character room code" maxlength="6" value="'+esc(room)+'"><div class="grid">'+names.map(n=>'<button class="'+n.toLowerCase()+'" onclick="join(\''+n+'\')">'+n+'</button>').join('')+'</div></div>'}
function track(t){let p=Math.min(94,t.score/26000*94);return '<div class="track"><div class="row"><b style="color:'+colors[t.name]+'">'+t.name+'</b><span>'+t.score.toLocaleString()+' pts</span></div><div class="trackline"><span class="car" style="left:'+p+'%">🏎️</span><span class="finish"></span></div></div>'}
function ranking(){let ordered=[...state.teams].sort((a,b)=>b.score-a.score||b.correct-a.correct);return '<div class="panel"><h2>🏆 Live leaderboard</h2>'+ordered.map((t,i)=>'<div class="rank row"><span>'+(i===0?'🥇':i===1?'🥈':'🥉')+' <b style="color:'+colors[t.name]+'">'+t.name+'</b></span><span class="score">'+t.score.toLocaleString()+'</span></div>').join('')+'</div>'}
function race(){return '<div class="panel"><div class="row"><h2>🏁 The Prayer Race</h2><span class="pill">Round '+(state.index+1)+' / 20</span></div>'+state.teams.map(track).join('')+'</div>'}
function hostView(){let s=state;let joinUrl=location.origin+'/?room='+s.code;let h='<div class="panel"><div class="row"><h2>Host Dashboard</h2><button class="secondary" onclick="reset()">Exit</button></div><div class="row"><div><div class="muted">GAME PIN</div><div class="big">'+s.code+'</div></div><div><div class="muted">Share with phones</div><a href="'+joinUrl+'">'+joinUrl+'</a></div></div><p>'+s.teams.map(t=>'<span class="pill">'+t.name+': '+(t.connected?'🟢 joined':'⚪ waiting')+'</span>').join(' ')+'</p></div>';
if(s.phase==='lobby')h+='<div class="panel center"><h2>Ready, set, pray!</h2><p class="muted">Ask all three teams to join before starting.</p><button onclick="act(\'start\')">Start 20-question race</button></div>';
if(s.phase==='question'||s.phase==='reveal'){h+='<div class="panel"><div class="row"><span class="pill">Question '+(s.index+1)+' of 20</span><span class="pill">'+s.teams.filter(t=>t.answered).length+' / 3 answered</span></div><h2>'+esc(s.question.text)+'</h2><div class="grid">'+s.question.options.map((a,i)=>'<div class="panel" style="margin:0;border-color:'+(s.reveal&&i===s.reveal.correct?'#3ee09b':'#3b4b70')+'"><b>'+['A','B','C','D'][i]+'.</b> '+esc(a)+'</div>').join('')+'</div></div>';
if(s.phase==='question')h+='<div class="center"><button onclick="act(\'reveal\')">Reveal answers & update race</button></div>';
else h+='<div class="panel"><h3 class="good">✓ Correct: '+esc(s.question.options[s.reveal.correct])+'</h3><b>'+esc(s.reveal.reference)+'</b><p>'+esc(s.reveal.explanation)+'</p><p>'+s.teams.map(t=>t.name+': +'+t.lastPoints).join(' · ')+'</p><button onclick="act(\'next\')">'+(s.index===19?'Show final winner 🏆':'Next question →')+'</button></div>'}
if(s.phase==='finished'){let win=[...s.teams].sort((a,b)=>b.score-a.score||b.correct-a.correct)[0];h+='<div class="panel center"><div class="confetti">🎉 🎊 🎉</div><div class="big">🏆</div><h1 style="color:'+colors[win.name]+'">'+win.name+' WINS!</h1><p>'+win.score.toLocaleString()+' points</p><button onclick="act(\'restart\')">Play again</button></div>'}
return h+race()+ranking()}
function teamView(){let s=state,t=s.teams.find(x=>x.name===id.team);let h='<div class="panel center"><div class="row"><span class="pill">'+esc(id.team)+' TEAM</span><span class="pill">Room '+s.code+'</span></div><h2 style="color:'+colors[id.team]+'">'+id.team+'</h2><p class="score">'+t.score.toLocaleString()+' points</p></div>';
if(s.phase==='lobby')h+='<div class="panel center"><h2>You're in! 🙌</h2><p>Wait for the host to start.</p></div>';
if(s.phase==='question'){h+='<div class="panel"><span class="pill">Question '+(s.index+1)+' / 20</span><h2>'+esc(s.question.text)+'</h2>';if(t.answered)h+='<p class="center good">✓ Answer submitted! Waiting for the host…</p>';else h+='<div class="grid">'+s.question.options.map((a,i)=>'<button class="answer" style="background:'+['#dc5468','#2998d7','#e2a72b','#28ad85'][i]+'" onclick="act(\'answer\',{choice:'+i+'})">'+['▲','◆','●','■'][i]+' '+esc(a)+'</button>').join('')+'</div>';h+='</div>'}
if(s.phase==='reveal')h+='<div class="panel center"><h2>'+esc(s.question.options[s.reveal.correct])+'</h2><p>'+esc(s.reveal.reference)+'</p><p>'+esc(s.reveal.explanation)+'</p><h2 class="'+(t.lastPoints?'good':'bad')+'">'+(t.lastPoints?'+'+t.lastPoints+' points!':'No points this round')+'</h2></div>';
if(s.phase==='finished')h+='<div class="panel center"><div class="big">🏆</div><h2>Race finished!</h2></div>';
return h+race()+ranking()}
function render(){if(!state)return renderHome();app.innerHTML=id.team?teamView():hostView()}
async function poll(){if(!id.code||!id.token)return;try{let r=await fetch('/api/state',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(id)});let j=await r.json();if(j.error){toast(j.error);return}let raw=JSON.stringify(j);if(raw!==last){last=raw;state=j;render()}}catch(e){}}
renderHome();poll();setInterval(poll,650);
</script></body></html>
